[package]
name = "hiewlm-cli"
description = "hiewLM headless batch tool: inspect, disassemble, search, patch from scripts/CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "hiewlmc"
path = "src/main.rs"

[dependencies]
hiewlm-core = { path = "../hiewlm-core" }
hiewlm-fmt = { path = "../hiewlm-fmt" }
hiewlm-asm = { path = "../hiewlm-asm" }
hiewlm-plugin = { path = "../hiewlm-plugin" }
hiewlm-plugin-zip = { path = "../hiewlm-plugin-zip" }
hiewlm-plugin-pdf = { path = "../hiewlm-plugin-pdf" }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
md-5 = "0.10"
sha2 = "0.10"
blake3 = "1"
rhai = "1"

[lints]
workspace = true
