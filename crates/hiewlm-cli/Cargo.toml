[package]
name = "hiewlm-cli"
description = "hiewLM headless batch tool: inspect, disassemble, search, patch from scripts/CI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "hiewlmc"
path = "src/main.rs"

[dependencies]
hiewlm-core = { path = "../hiewlm-core" }
hiewlm-fmt = { path = "../hiewlm-fmt" }
hiewlm-triage = { path = "../hiewlm-triage" }
hiewlm-office = { path = "../hiewlm-office" }
hiewlm-asm = { path = "../hiewlm-asm" }
hiewlm-plugin = { path = "../hiewlm-plugin", optional = true }
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
md-5 = "0.10"
sha2 = "0.10"
blake3 = "1"
rhai = { version = "1", optional = true }
serde_json = "1"

[features]
# Nothing heavy is on by default. Each of these pulls in a large dependency that
# most triage work never touches, and a binary you actually carry around should
# not pay for features you do not use.
default = []
# YARA scanning via yara-x (pure Rust, no libyara).
yara = ["hiewlm-triage/yara"]
# `hiewlmc script` — Rhai scripted patching.
script = ["dep:rhai"]
# `hiewlmc plugin` — sandboxed WASM plugins (pulls in wasmtime).
wasm = ["dep:hiewlm-plugin"]
# Everything, for a full-fat build.
full = ["yara", "script", "wasm"]

[lints]
workspace = true
